# List of Jarvis projects
jarvis_projects:
  - name: "Linux Cluster Monitoring Agent"
    git_url: "https://github.com/jarviscanada/jarvis_data_eng_ShelbyHall/tree/develop/linux_sql"
    # The project description allows hiring managers to understand your project and technologies you used(e.g. programming languages, libraries, algorithms, hardware, tools, etc.).
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: "During this project, I developed a Linux Cluster Monitoring Agent installed across cluster nodes using Bash to collect hardware specifications and real-time resource usage data, storing it in a centralized PostgreSQL database, provisioned via Docker, for historical analysis. The primary purpose is to proactively identify underperforming servers and detect node failures before they impact production workloads, giving backend developers and operations teams clear, ongoing visibility into cluster health. "  
  - name: "Python Data Analytics"
    git_url: "https://github.com/jarviscanada/jarvis_data_eng_ShelbyHall/tree/develop/python_data_analytics"
    description:
      - "I designed and built a lightweight, reproducible analytics environment using Docker to provision two containers: a PostgreSQL data warehouse to store sanitized transaction records, and a Jupyter Notebook environment (Python, Pandas, NumPy, Matplotlib, Seaborn, SQLAlchemy) to query and analyze the data directly, with both containers communicating over a shared Docker bridge network. I analyzed two years of transaction history to uncover trends in order volume, seasonality, cancellations, and customer spend, and performed RFM (Recency, Frequency, Monetary) segmentation to identify distinct customer groups. I concluded the project by presenting my findings and recommendations to stakeholders, walking through the key trends uncovered in the data and the marketing actions each one supported."
   - name: "Monthly Reporting Dashboard"
     git_url: "/springboot"
     description: "I acted as the primary liaison between business stakeholders and the technical development team to replace an error-prone monthly reporting process at RBC GAM. My role centred on requirements gathering by meeting with stakeholders across the organization and translating their needs into clear, actionable requirements, and ensuring the dashboard genuinely solved the problems it was meant to address. Throughout the project, I maintained ongoing communication and validated that in-progress work matched stakeholder expectations. Once the dashboard was built, I prepared and delivered a presentation to stakeholders summarizing the solution, its capabilities, and the value it provided in reducing manual reporting effort and giving teams real-time visibility into resource allocation."
