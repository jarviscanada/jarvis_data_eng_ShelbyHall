# List of personal or academic projects
highlighted_projects:
  - name: "B2B Membership Growth & Sales Tracking Initiative"
    git_url: "https://github.com"
    description: "I have collaborated in creating a structured outreach and tracking initiative to drive Costco Business Executive Membership sign-ups across 50+ external organizations and hundreds of employees in the Peel Region. This was designed to maintain a centralized tracking system to monitor all outreach activities, sales interactions, and membership conversion outcomes, enabling data-driven decisions to optimize campaign performance. The database was built using Excel to track 50+ target companies, logging contact details, outreach history, and follow-up schedules. With that being said, I coordinated multi-touch sales and marketing activities, such as in-person visits, email campaigns, and event outreaches across manufacturing, retail, and services sectors. With this program, I delivered weekly progress reports to the sales team, refining targeting strategy based on conversion trends."  

