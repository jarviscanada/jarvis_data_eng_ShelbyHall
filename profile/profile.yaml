# Introduce yourself, your academic and professional background.

# What excites you about the software industry and your passion. At least 80 words
summary: "I am a BASc graduate from the University of Guelph-Humber with over four years of client-facing experience in sales and marketing, complemented by a technical foundation in database design, and data analytics. My academic background instilled a naturally investigative approach to problem-solving which is a mindset that ties closely into the diagnostic, requirements-driven nature of business analysis. 

What draws me to the software industry is that it sits at the center of solving modern problems: my background in sales and client management taught me how to identify what people need and find the most effective way to deliver it, while my investigative training taught me how to dig past the surface of a problem to understand what's actually driving it. I'm drawn to environments where there's always a better approach to discover or a more elegant solution to build, and as someone who thrives on growth and challenge, that's exactly what I'm seeking in this next step of my career."  

