professional_experience:
  #Write your Jarvis role as a professional experience rather than training.
  - title: "Business Systems Analyst"
    company: "Jarvis Consulting Group"
    duration: "2026-present"
    # The project description must start with an action verb (https://bit.ly/3guO98u)
    description: "During my employment, I've worked on projects spanning the full software development lifecycle. My core focus has been gathering business requirements, translating them into clear specifications that development teams can act on, and validating that delivered solutions align with what stakeholders need. I've supported this with a working knowledge of the underlying data, including relational schemas, SQL reporting queries, and analytics workflows, giving me enough technical fluency to understand feasibility, ask the right questions, and bridge conversations between business and technical teams. I've also presented completed solutions back to stakeholders, communicating value and impact in business terms. This blend of requirements-driven thinking and technical grounding has strengthened both my analytical range and my ability to lead cross-functional communication."
  - title: "Sales and Marketing Agent"
    company: "Costco Wholesale"
    duration: "2021-2026"
    description: "I drove high-ticket product sales across the Peel Region, achieving a 96% success rate through strategic client engagement and tailored pitch positioning. I partnered with the marketing team to develop and execute regional campaigns that grew brand awareness and deepened customer relationships. To achieve the target goals, I collaborated with my team to plan and lead promotional events across multiple locations, acting as the face of the brand and primary liaison between the company and its clients. In the background, when not communicating with clients directly, I managed client accounts using CRM software to track interactions, retention, and account history, maintaining accurate financial record-keeping while consistently exceeding revenue targets."

